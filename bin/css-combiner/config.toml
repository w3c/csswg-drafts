[specs.cssom-view-1]
[specs.geometry-1]
[specs.resize-observer-1]


# ------------------------------------------------------------------------------
# 11. CSS Level 2 Baseline (`css2`)
# ------------------------------------------------------------------------------
# Placed after modern modular specifications so Ctrl-F / sequential reading hits
# current module definitions first while preserving vital CSS 2.2 concepts (e.g.,
# visual formatting model details) not yet migrated to CSS3+ modules.
[specs.css2]


# ==============================================================================
# Intentionally Omitted Directories (`[skip]`)
# ==============================================================================
[skip]
# Meta / template specs (not CSS specifications)
css-module = "Bikeshed example template module"
indexes = "Generated meta-index of CSS definitions"

# Redirect stubs
css-scoping-1 = "Redirect stub to css-shadow-1"
css-shadow-parts-1 = "Redirect stub to css-shadow-1"

# Abandoned, retired, empty placeholder, joke, and Working Group Note specs
css-contain-3 = "Empty placeholder spec (features moved to css-contain-2 and css-conditional-5)"
css-egg-1 = "April Fools' joke specification"
css-mobile = "Abandoned CSS Mobile Profile"
css-page-template-1 = "Abandoned pagination templates draft"
css-preslev-1 = "Discontinued Working Group Note"
css-print = "Abandoned CSS Print Profile"
css-shaders-1 = "Abandoned CSS Shaders draft"
css-template-1 = "Discontinued template layout draft (superseded by css-grid)"
css-tv = "Retired CSS TV Profile Working Group Note"
matrix = "Abandoned Working Group Note (superseded by geometry-1)"
selectors-nonelement-1 = "Discontinued Working Group Note"

# Superseded earlier levels (where a later level is a complete replacement)
compositing-1 = "Replaced by compositing-2"
css-backgrounds-3 = "Replaced by css-backgrounds-4 and css-borders-4"
css-box-3 = "Replaced by css-box-4"
css-break-3 = "Replaced by css-break-4"
css-cascade-3 = "Replaced by css-cascade-5"
css-cascade-4 = "Replaced by css-cascade-5"
css-color-3 = "Replaced by css-color-4"
css-contain-1 = "Replaced by css-contain-2"
css-display-3 = "Replaced by css-display-4"
css-easing-1 = "Replaced by css-easing-2"
css-flexbox-1 = "Replaced by css-flexbox-2"
css-fonts-3 = "Replaced by css-fonts-4"
css-grid-1 = "Replaced by css-grid-2"
css-multicol-1 = "Replaced by css-multicol-2"
css-overscroll-1 = "Replaced by css-overscroll-2"
css-text-3 = "Replaced by css-text-4"
css-text-decor-3 = "Replaced by css-text-decor-4"
css-ui-3 = "Replaced by css-ui-4"
css-values-3 = "Replaced by css-values-4"
css-variables-1 = "Replaced by css-variables-2"
css-view-transitions-1 = "Replaced by css-view-transitions-2"
css-writing-modes-3 = "Replaced by css-writing-modes-4"
mediaqueries-3 = "Replaced by mediaqueries-5"
mediaqueries-4 = "Replaced by mediaqueries-5"
selectors-3 = "Replaced by selectors-4"


# ==============================================================================
# Superseded Level Redirects (`[replaced]`)
# ==============================================================================
# Maps skipped earlier levels to the combined spec(s) that supersede them.
# Cross-document links to a superseded level rewrite to its replacement when the
# target anchor exists there, falling back to the external URL otherwise.
[replaced]
compositing-1 = ["compositing-2"]
css-backgrounds-3 = ["css-backgrounds-4", "css-borders-4"]
css-box-3 = ["css-box-4"]
css-break-3 = ["css-break-4"]
css-cascade-3 = ["css-cascade-5"]
css-cascade-4 = ["css-cascade-5"]
css-color-3 = ["css-color-4"]
css-contain-1 = ["css-contain-2"]
css-display-3 = ["css-display-4"]
css-easing-1 = ["css-easing-2"]
css-flexbox-1 = ["css-flexbox-2"]
css-fonts-3 = ["css-fonts-4"]
css-grid-1 = ["css-grid-2"]
css-multicol-1 = ["css-multicol-2"]
css-overscroll-1 = ["css-overscroll-2"]
css-scoping-1 = ["css-shadow-1"]
css-shadow-parts-1 = ["css-shadow-1"]
css-text-3 = ["css-text-4"]
css-text-decor-3 = ["css-text-decor-4"]
css-ui-3 = ["css-ui-4"]
css-values-3 = ["css-values-4"]
css-variables-1 = ["css-variables-2"]
css-view-transitions-1 = ["css-view-transitions-2"]
css-writing-modes-3 = ["css-writing-modes-4"]
mediaqueries-3 = ["mediaqueries-5"]
mediaqueries-4 = ["mediaqueries-5"]
selectors-3 = ["selectors-4"]


# ==============================================================================
# CSS Combiner Configuration (`config.toml`)
# ==============================================================================
#
# This file configures how `combine.py` discovers, filters, orders, and combines
# specifications in the `csswg-drafts` repository into `all-css/index.html` and
# `all-css/index.md`.
#
# HOW DYNAMIC DISCOVERY WORKS
# ---------------------------
# On each run, the combiner scans top-level directories in the repository root
# for spec source files (`Overview.bs`, `index.bs`, or `Overview.html`).
#
# * Snapshot directories matching `css-YEAR` (e.g., `css-2025`, `css-2026`) are
#   omitted automatically and do NOT need to be listed here.
# * Every other discovered spec directory MUST appear in EITHER `[specs.<dir>]`
#   (to include it in the combined document) OR `[skip]` (to intentionally omit
#   it). If an unconfigured directory is found, the combiner logs an error,
#   emits a dismissable warning banner in `all-css/index.html`, skips that
#   directory, and still exits with status 0 so CI deployment succeeds.
#
# HOW TO ADD OR UPDATE A SPEC
# ---------------------------
# 1. To INCLUDE a new spec, add `[specs.<folder-name>]` in the desired position
#    below. Specs are emitted in the exact order they appear in this file, 
#    currently organized roughly from most foundational to more specialized. 
#    Keep multiple levels of the same spec adjacent in ascending level order 
#    (e.g., `css-foo-1`, `css-foo-2`).
#
#    Supported keys under `[specs.<folder-name>]`:
#      diff_of = "<base-folder>"   # Optional. Set when this spec is a delta/diff
#                                  # over an earlier level (which must also be
#                                  # included above it).
#
# 2. If a new level is a FULL REPLACEMENT for an earlier level (not a diff spec),
#    move the superseded folder from `[specs.*]` to `[skip]` with a brief note,
#    record its replacement target(s) under `[replaced]`, and add
#    `[specs.<new-folder>]` in its place.
#
# 3. To OMIT a spec (abandoned, retired, WG Note, redirect stub, or superseded
#    level), add `<folder-name> = "<reason>"` under `[skip]` at the bottom of
#    this file.
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. Core Syntax, Values, Cascade & Variables
# ------------------------------------------------------------------------------
[specs.css-syntax-3]
[specs.css-style-attr-1]
[specs.css-values-4]
[specs.css-values-5]
diff_of = "css-values-4"

[specs.css-cascade-5]
[specs.css-cascade-6]
diff_of = "css-cascade-5"

[specs.css-variables-2]
[specs.css-env-1]
[specs.css-mixins-1]
[specs.css-conditional-values-1]
[specs.css-extensions-1]
[specs.css-link-params-1]



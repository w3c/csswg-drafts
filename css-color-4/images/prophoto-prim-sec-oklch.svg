<svg xmlns="http://www.w3.org/2000/svg" viewBox="-152.64 -39.49 222 121" overflow="visible" width="700" height="382">
<desc>Show a top-down view of the OKLab color space.
      The prophoto-rgb primaries and secondaries are shown,
      with a legend giving the OKLCH L, C and H values.
      For comparison, the sRGB primaries and secondaries are also shown (dashed lines).
</desc>
<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->
<rect x="-152.64" y="-39.49" width="100%" height="100%" fill="white" />
<g fill="none" stroke="black" stroke-width="0.3">

<!-- axes -->
<polyline points="0 -31.49 0 48.73"/>
<polyline points="-140.64 0 50.97 0"/>

<!-- tic marks -->
<g stroke="#888">
<path d="M-1.5,-30 h3 M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3 M-1.5,40 h3"/>
<path d="M-140,-1.5 v3 M-130,-1.5 v3 M-120,-1.5 v3 M-110,-1.5 v3 M-100,-1.5 v3 M-90,-1.5 v3 M-80,-1.5 v3 M-70,-1.5 v3 M-60,-1.5 v3 M-50,-1.5 v3 M-40,-1.5 v3 M-30,-1.5 v3 M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3 M40,-1.5 v3 M50,-1.5 v3"/>
</g>

<g stroke-dasharray="0.6 1.2" stroke="#bbb">
<!-- radial lines for sRGB hue angle and chroma -->
<polyline points="0,0 22.4863,-12.5846"/>
<polyline points="0,0 -23.3888,-17.9498"/>
<polyline points="0,0 -3.2457,31.1528"/>
<polyline points="0,0 -14.9444,3.9398"/>
<polyline points="0,0 27.4566,16.9156"/>
<polyline points="0,0 -7.1369,-19.8570"/>
</g>
<!-- radial lines for prophoto-rgb hue angle and chroma -->
<polyline points="0,0 40.6680,-14.4621"/>
<polyline points="0,0 -46.7817,-24.0727"/>
<polyline points="0,0 -134.6398,42.7347"/>
<polyline points="0,0 -44.7850,5.7496"/>
<polyline points="0,0 44.9664,19.0465"/>
<polyline points="0,0 -5.8583,-25.4946"/>
</g>

<!-- sRGB primaries and secondaries -->
<g stroke-dasharray="0.6 1.2" stroke="#bbb" stroke-width="0.3" fill="white">
  <circle r="1.3" cx="22.4863" cy="-12.5846" fill="#FF000040"/>
  <circle r="1.3" cx="-23.3888" cy="-17.9498" fill="#00FF0040"/>
  <circle r="1.3" cx="-3.2457" cy="31.1528" fill="#0000FF40"/>
  <circle r="1.3" cx="-14.9444" cy="3.9398" fill="#00FFFF40"/>
  <circle r="1.3" cx="27.4566" cy="16.9156" fill="#FF00FF40"/>
  <circle r="1.3" cx="-7.1369" cy="-19.8570" fill="#FFFF0040"/>
</g>

<!-- prophoto-rgb primaries and secondaries -->
<!-- the fill colors are sRGB, *not the prophoto-rgb colors* -->
<g stroke="none">
  <circle r="1.3" cx="40.6680" cy="-14.4621" fill="red"/>
  <circle r="1.3" cx="-46.7817" cy="-24.0727" fill="green"/>
  <circle r="1.3" cx="-134.6398" cy="42.7347" fill="blue"/>
  <circle r="1.3" cx="-44.7850" cy="5.7496" fill="cyan"/>
  <circle r="1.3" cx="44.9664" cy="19.0465" fill="magenta"/>
  <circle r="1.3" cx="-5.8583" cy="-25.4946" fill="yellow"/>
</g>

<circle r="1.8" fill="black"/>
<circle r="1.3" fill="#777"/>
<circle r="0.8" fill="#fff"/>
<g font-family="sans-serif" font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
  <text x="52.97" y="1">+a</text>
  <text x="-142.64" y="1" text-anchor="end">-a</text>
  <text x="2" y="53.73">-b</text>
  <text x="2" y="-34.489999999999995">+b</text>
</g>

<g font-family="sans-serif" font-size="2.4pt">
  <text x="-37.55" y="58.73" font-weight="bold">L</text>
  <text x="-25.62" y="58.73" font-weight="bold">C</text>
  <text x="-12.2" y="58.73" font-weight="bold">H</text>
  <text x="26.31" y="58.73" font-weight="bold">L</text>
  <text x="38.24" y="58.73" font-weight="bold">C</text>
  <text x="51.66" y="58.73" font-weight="bold">H</text>
  <circle r="1.08" cx="-62.49" cy="62.69" fill="red"/>
  <text x="-58.41" y="63.53">red</text>
  <text x="-37.55" y="63.53">70.20%</text>
  <text x="-25.62" y="63.53">0.43163</text>
  <text x="-12.2" y="63.53">19.58</text>
  <circle r="1.08" cx="8.81" cy="62.69" fill="cyan"/>
  <text x="12.89" y="63.53">cyan</text>
  <text x="26.31" y="63.53">84.76%</text>
  <text x="38.24" y="63.53">0.45153</text>
  <text x="51.66" y="63.53">187.32</text>
  <circle r="1.08" cx="-62.49" cy="67.49" fill="green"/>
  <text x="-58.41" y="68.33">green</text>
  <text x="-37.55" y="68.33">84.01%</text>
  <text x="-25.62" y="68.33">0.52612</text>
  <text x="-12.2" y="68.33">152.77</text>
  <circle r="1.08" cx="8.81" cy="67.49" fill="magenta"/>
  <text x="12.89" y="68.33">magenta</text>
  <text x="26.31" y="68.33">72.79%</text>
  <text x="38.24" y="68.33">0.48834</text>
  <text x="51.66" y="68.33">337.04</text>
  <circle r="1.08" cx="-62.49" cy="72.29" fill="blue"/>
  <text x="-58.41" y="73.13">blue</text>
  <text x="-37.55" y="73.13">21.72%</text>
  <text x="-25.62" y="73.13">1.41259</text>
  <text x="-12.2" y="73.13">197.61</text>
  <circle r="1.08" cx="8.81" cy="72.29" fill="yellow"/>
  <text x="12.89" y="73.13">yellow</text>
  <text x="26.31" y="73.13">99.04%</text>
  <text x="38.24" y="73.13">0.26159</text>
  <text x="51.66" y="73.13">102.94</text>
</g>
</svg>

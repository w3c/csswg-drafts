<!-- axis baselines -->
<line x1="60" y1="460" x2="500" y2="460" stroke="#c3c2b7" stroke-width="1"/>
<line x1="60" y1="460" x2="60"  y2="70"  stroke="#c3c2b7" stroke-width="1"/>


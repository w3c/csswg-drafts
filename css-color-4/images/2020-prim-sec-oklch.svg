<svg xmlns="http://www.w3.org/2000/svg" viewBox="-65.85 -37.8 132 112" overflow="visible" width="700" height="594">
<desc>Show a top-down view of the OKLab color space.
      The rec2020 primaries and secondaries are shown,
      with a legend giving the OKLCH L, C and H values.
      For comparison, the sRGB primaries and secondaries are also shown (dashed lines).
</desc>
<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->
<rect x="-65.85" y="-37.8" width="100%" height="100%" fill="white" />
<g fill="none" stroke="black" stroke-width="0.3">

<!-- axes -->
<polyline points="0 -29.8 0 40.71"/>
<polyline points="-47.58 0 44.77 0"/>

<!-- tic marks -->
<g stroke="#888">
<path d="M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3 M-1.5,40 h3"/>
<path d="M-40,-1.5 v3 M-30,-1.5 v3 M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3 M40,-1.5 v3"/>
</g>

<g stroke-dasharray="0.6 1.2" stroke="#bbb">
<!-- radial lines for sRGB hue angle and chroma -->
<polyline points="0,0 22.4863,-12.5846"/>
<polyline points="0,0 -23.3888,-17.9498"/>
<polyline points="0,0 -3.2457,31.1528"/>
<polyline points="0,0 -14.9444,3.9398"/>
<polyline points="0,0 27.4566,16.9156"/>
<polyline points="0,0 -7.1369,-19.8570"/>
</g>
<!-- radial lines for rec2020 hue angle and chroma -->
<polyline points="0,0 33.2730,-14.9438"/>
<polyline points="0,0 -41.5774,-21.5562"/>
<polyline points="0,0 -16.1378,34.7132"/>
<polyline points="0,0 -31.9793,5.5543"/>
<polyline points="0,0 38.7745,16.8179"/>
<polyline points="0,0 -7.9959,-23.7978"/>
</g>

<!-- sRGB primaries and secondaries -->
<g stroke-dasharray="0.6 1.2" stroke="#bbb" stroke-width="0.3" fill="white">
  <circle r="1.3" cx="22.4863" cy="-12.5846" fill="#FF000040"/>
  <circle r="1.3" cx="-23.3888" cy="-17.9498" fill="#00FF0040"/>
  <circle r="1.3" cx="-3.2457" cy="31.1528" fill="#0000FF40"/>
  <circle r="1.3" cx="-14.9444" cy="3.9398" fill="#00FFFF40"/>
  <circle r="1.3" cx="27.4566" cy="16.9156" fill="#FF00FF40"/>
  <circle r="1.3" cx="-7.1369" cy="-19.8570" fill="#FFFF0040"/>
</g>

<!-- rec2020 primaries and secondaries -->
<!-- the fill colors are sRGB, *not the rec2020 colors* -->
<g stroke="none">
  <circle r="1.3" cx="33.2730" cy="-14.9438" fill="red"/>
  <circle r="1.3" cx="-41.5774" cy="-21.5562" fill="green"/>
  <circle r="1.3" cx="-16.1378" cy="34.7132" fill="blue"/>
  <circle r="1.3" cx="-31.9793" cy="5.5543" fill="cyan"/>
  <circle r="1.3" cx="38.7745" cy="16.8179" fill="magenta"/>
  <circle r="1.3" cx="-7.9959" cy="-23.7978" fill="yellow"/>
</g>

<circle r="1.8" fill="black"/>
<circle r="1.3" fill="#777"/>
<circle r="0.8" fill="#fff"/>
<g font-family="sans-serif" font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
  <text x="46.77" y="1">+a</text>
  <text x="-49.58" y="1" text-anchor="end">-a</text>
  <text x="2" y="45.71">-b</text>
  <text x="2" y="-32.8">+b</text>
</g>

<g font-family="sans-serif" font-size="2.4pt">
  <text x="-41.27" y="50.71" font-weight="bold">L</text>
  <text x="-29.34" y="50.71" font-weight="bold">C</text>
  <text x="-15.92" y="50.71" font-weight="bold">H</text>
  <text x="22.59" y="50.71" font-weight="bold">L</text>
  <text x="34.52" y="50.71" font-weight="bold">C</text>
  <text x="47.94" y="50.71" font-weight="bold">H</text>
  <circle r="1.08" cx="-58.77" cy="54.67" fill="red"/>
  <text x="-54.69" y="55.51">red</text>
  <text x="-41.27" y="55.51">68.71%</text>
  <text x="-29.34" y="55.51">0.36475</text>
  <text x="-15.92" y="55.51">24.19</text>
  <circle r="1.08" cx="5.09" cy="54.67" fill="cyan"/>
  <text x="9.17" y="55.51">cyan</text>
  <text x="22.59" y="55.51">86.51%</text>
  <text x="34.52" y="55.51">0.32458</text>
  <text x="47.94" y="55.51">189.85</text>
  <circle r="1.08" cx="-58.77" cy="59.47" fill="green"/>
  <text x="-54.69" y="60.31">green</text>
  <text x="-41.27" y="60.31">82.98%</text>
  <text x="-29.34" y="60.31">0.46833</text>
  <text x="-15.92" y="60.31">152.60</text>
  <circle r="1.08" cx="5.09" cy="59.47" fill="magenta"/>
  <text x="9.17" y="60.31">magenta</text>
  <text x="22.59" y="60.31">74.43%</text>
  <text x="34.52" y="60.31">0.42265</text>
  <text x="47.94" y="60.31">336.55</text>
  <circle r="1.08" cx="-58.77" cy="64.27" fill="blue"/>
  <text x="-54.69" y="65.11">blue</text>
  <text x="-41.27" y="65.11">42.34%</text>
  <text x="-29.34" y="65.11">0.38281</text>
  <text x="-15.92" y="65.11">245.07</text>
  <circle r="1.08" cx="5.09" cy="64.27" fill="yellow"/>
  <text x="9.17" y="65.11">yellow</text>
  <text x="22.59" y="65.11">97.26%</text>
  <text x="34.52" y="65.11">0.25105</text>
  <text x="47.94" y="65.11">108.57</text>
</g>
</svg>

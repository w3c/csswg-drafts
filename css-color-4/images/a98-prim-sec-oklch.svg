<svg xmlns="http://www.w3.org/2000/svg" viewBox="-65.85 -35.18 132 106" overflow="visible" width="700" height="563">
<desc>Show a top-down view of the OKLab color space.
      The a98-rgb primaries and secondaries are shown,
      with a legend giving the OKLCH L, C and H values.
      For comparison, the sRGB primaries and secondaries are also shown (dashed lines).
</desc>
<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->
<rect x="-65.85" y="-35.18" width="100%" height="100%" fill="white" />
<g fill="none" stroke="black" stroke-width="0.3">

<!-- axes -->
<polyline points="0 -27.18 0 37.59"/>
<polyline points="-40.71 0 36.89 0"/>

<!-- tic marks -->
<g stroke="#888">
<path d="M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3"/>
<path d="M-40,-1.5 v3 M-30,-1.5 v3 M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3"/>
</g>

<g stroke-dasharray="0.6 1.2" stroke="#bbb">
<!-- radial lines for sRGB hue angle and chroma -->
<polyline points="0,0 22.4863,-12.5846"/>
<polyline points="0,0 -23.3888,-17.9498"/>
<polyline points="0,0 -3.2457,31.1528"/>
<polyline points="0,0 -14.9444,3.9398"/>
<polyline points="0,0 27.4566,16.9156"/>
<polyline points="0,0 -7.1369,-19.8570"/>
</g>
<!-- radial lines for a98-rgb hue angle and chroma -->
<polyline points="0,0 25.1453,-14.0728"/>
<polyline points="0,0 -34.7125,-18.7932"/>
<polyline points="0,0 -3.2915,31.5924"/>
<polyline points="0,0 -24.3425,5.8222"/>
<polyline points="0,0 30.8879,14.1627"/>
<polyline points="0,0 -7.6927,-21.1754"/>
</g>

<!-- sRGB primaries and secondaries -->
<g stroke-dasharray="0.6 1.2" stroke="#bbb" stroke-width="0.3" fill="white">
  <circle r="1.3" cx="22.4863" cy="-12.5846" fill="#FF000040"/>
  <circle r="1.3" cx="-23.3888" cy="-17.9498" fill="#00FF0040"/>
  <circle r="1.3" cx="-3.2457" cy="31.1528" fill="#0000FF40"/>
  <circle r="1.3" cx="-14.9444" cy="3.9398" fill="#00FFFF40"/>
  <circle r="1.3" cx="27.4566" cy="16.9156" fill="#FF00FF40"/>
  <circle r="1.3" cx="-7.1369" cy="-19.8570" fill="#FFFF0040"/>
</g>

<!-- a98-rgb primaries and secondaries -->
<!-- the fill colors are sRGB, *not the a98-rgb colors* -->
<g stroke="none">
  <circle r="1.3" cx="25.1453" cy="-14.0728" fill="red"/>
  <circle r="1.3" cx="-34.7125" cy="-18.7932" fill="green"/>
  <circle r="1.3" cx="-3.2915" cy="31.5924" fill="blue"/>
  <circle r="1.3" cx="-24.3425" cy="5.8222" fill="cyan"/>
  <circle r="1.3" cx="30.8879" cy="14.1627" fill="magenta"/>
  <circle r="1.3" cx="-7.6927" cy="-21.1754" fill="yellow"/>
</g>

<circle r="1.8" fill="black"/>
<circle r="1.3" fill="#777"/>
<circle r="0.8" fill="#fff"/>
<g font-family="sans-serif" font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
  <text x="38.89" y="1">+a</text>
  <text x="-42.71" y="1" text-anchor="end">-a</text>
  <text x="2" y="42.59">-b</text>
  <text x="2" y="-30.18">+b</text>
</g>

<g font-family="sans-serif" font-size="2.4pt">
  <text x="-41.27" y="47.59" font-weight="bold">L</text>
  <text x="-29.34" y="47.59" font-weight="bold">C</text>
  <text x="-15.92" y="47.59" font-weight="bold">H</text>
  <text x="22.59" y="47.59" font-weight="bold">L</text>
  <text x="34.52" y="47.59" font-weight="bold">C</text>
  <text x="47.94" y="47.59" font-weight="bold">H</text>
  <circle r="1.08" cx="-58.77" cy="51.55" fill="red"/>
  <text x="-54.69" y="52.39">red</text>
  <text x="-41.27" y="52.39">70.22%</text>
  <text x="-29.34" y="52.39">0.28815</text>
  <text x="-15.92" y="52.39">29.23</text>
  <circle r="1.08" cx="5.09" cy="51.55" fill="cyan"/>
  <text x="9.17" y="52.39">cyan</text>
  <text x="22.59" y="52.39">86.00%</text>
  <text x="34.52" y="52.39">0.25029</text>
  <text x="47.94" y="52.39">193.45</text>
  <circle r="1.08" cx="-58.77" cy="56.35" fill="green"/>
  <text x="-54.69" y="57.19">green</text>
  <text x="-41.27" y="57.19">81.49%</text>
  <text x="-29.34" y="57.19">0.39473</text>
  <text x="-15.92" y="57.19">151.57</text>
  <circle r="1.08" cx="5.09" cy="56.35" fill="magenta"/>
  <text x="9.17" y="57.19">magenta</text>
  <text x="22.59" y="57.19">76.54%</text>
  <text x="34.52" y="57.19">0.33980</text>
  <text x="47.94" y="57.19">335.37</text>
  <circle r="1.08" cx="-58.77" cy="61.15" fill="blue"/>
  <text x="-54.69" y="61.99">blue</text>
  <text x="-41.27" y="61.99">45.84%</text>
  <text x="-29.34" y="61.99">0.31763</text>
  <text x="-15.92" y="61.99">264.05</text>
  <circle r="1.08" cx="5.09" cy="61.15" fill="yellow"/>
  <text x="9.17" y="61.99">yellow</text>
  <text x="22.59" y="61.99">96.66%</text>
  <text x="34.52" y="61.99">0.22529</text>
  <text x="47.94" y="61.99">109.97</text>
</g>
</svg>

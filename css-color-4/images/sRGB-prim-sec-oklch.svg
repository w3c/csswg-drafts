<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64.36 -33.86 129 104" overflow="visible" width="700" height="567">
<desc>Show a top-down view of the OKLab color space.
      The sRGB primaries and secondaries are shown,
      with a legend giving the OKLCH L, C and H values.
</desc>
<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->
<rect x="-64.36" y="-33.86" width="100%" height="100%" fill="white" />
<g fill="none" stroke="black" stroke-width="0.3">

<!-- axes -->
<polyline points="0 -25.86 0 37.15"/>
<polyline points="-29.39 0 33.46 0"/>

<!-- tic marks -->
<g stroke="#888">
<path d="M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3"/>
<path d="M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3"/>
</g>

<!-- radial lines for sRGB hue angle and chroma -->
<polyline points="0,0 22.4863,-12.5846"/>
<polyline points="0,0 -23.3888,-17.9498"/>
<polyline points="0,0 -3.2457,31.1528"/>
<polyline points="0,0 -14.9444,3.9398"/>
<polyline points="0,0 27.4566,16.9156"/>
<polyline points="0,0 -7.1369,-19.8570"/>
</g>

<!-- sRGB primaries and secondaries -->
<!-- the fill colors are sRGB, *not the sRGB colors* -->
<g stroke="none">
  <circle r="1.3" cx="22.4863" cy="-12.5846" fill="red"/>
  <circle r="1.3" cx="-23.3888" cy="-17.9498" fill="green"/>
  <circle r="1.3" cx="-3.2457" cy="31.1528" fill="blue"/>
  <circle r="1.3" cx="-14.9444" cy="3.9398" fill="cyan"/>
  <circle r="1.3" cx="27.4566" cy="16.9156" fill="magenta"/>
  <circle r="1.3" cx="-7.1369" cy="-19.8570" fill="yellow"/>
</g>

<circle r="1.8" fill="black"/>
<circle r="1.3" fill="#777"/>
<circle r="0.8" fill="#fff"/>
<g font-family="sans-serif" font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
  <text x="35.46" y="1">+a</text>
  <text x="-31.39" y="1" text-anchor="end">-a</text>
  <text x="2" y="42.15">-b</text>
  <text x="2" y="-28.86">+b</text>
</g>

<g font-family="sans-serif" font-size="2.4pt">
  <text x="-42.76" y="47.15" font-weight="bold">L</text>
  <text x="-30.83" y="47.15" font-weight="bold">C</text>
  <text x="-17.41" y="47.15" font-weight="bold">H</text>
  <text x="21.1" y="47.15" font-weight="bold">L</text>
  <text x="33.03" y="47.15" font-weight="bold">C</text>
  <text x="46.45" y="47.15" font-weight="bold">H</text>
  <circle r="1.08" cx="-57.28" cy="51.11" fill="red"/>
  <text x="-53.2" y="51.95">red</text>
  <text x="-42.76" y="51.95">62.80%</text>
  <text x="-30.83" y="51.95">0.25768</text>
  <text x="-17.41" y="51.95">29.23</text>
  <circle r="1.08" cx="3.6" cy="51.11" fill="cyan"/>
  <text x="7.68" y="51.95">cyan</text>
  <text x="21.1" y="51.95">90.54%</text>
  <text x="33.03" y="51.95">0.15455</text>
  <text x="46.45" y="51.95">194.77</text>
  <circle r="1.08" cx="-57.28" cy="55.91" fill="green"/>
  <text x="-53.2" y="56.75">green</text>
  <text x="-42.76" y="56.75">86.64%</text>
  <text x="-30.83" y="56.75">0.29483</text>
  <text x="-17.41" y="56.75">142.50</text>
  <circle r="1.08" cx="3.6" cy="55.91" fill="magenta"/>
  <text x="7.68" y="56.75">magenta</text>
  <text x="21.1" y="56.75">70.17%</text>
  <text x="33.03" y="56.75">0.32249</text>
  <text x="46.45" y="56.75">328.36</text>
  <circle r="1.08" cx="-57.28" cy="60.71" fill="blue"/>
  <text x="-53.2" y="61.55">blue</text>
  <text x="-42.76" y="61.55">45.20%</text>
  <text x="-30.83" y="61.55">0.31321</text>
  <text x="-17.41" y="61.55">264.05</text>
  <circle r="1.08" cx="3.6" cy="60.71" fill="yellow"/>
  <text x="7.68" y="61.55">yellow</text>
  <text x="21.1" y="61.55">96.80%</text>
  <text x="33.03" y="61.55">0.21101</text>
  <text x="46.45" y="61.55">109.77</text>
</g>
</svg>

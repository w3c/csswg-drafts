<svg xmlns="http://www.w3.org/2000/svg" viewBox="-68.08 -36.99 136 108" overflow="visible" width="700" height="557">
<desc>Show a top-down view of the OKLab color space.
      The display-p3 primaries and secondaries are shown,
      with a legend giving the OKLCH L, C and H values.
      For comparison, the sRGB primaries and secondaries are also shown (dashed lines).
</desc>
<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->
<rect x="-68.08" y="-36.99" width="100%" height="100%" fill="white" />
<g fill="none" stroke="black" stroke-width="0.3">

<!-- axes -->
<polyline points="0 -28.99 0 38.14"/>
<polyline points="-36.42 0 37.64 0"/>

<!-- tic marks -->
<g stroke="#888">
<path d="M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3"/>
<path d="M-30,-1.5 v3 M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3"/>
</g>

<g stroke-dasharray="0.6 1.2" stroke="#bbb">
<!-- radial lines for sRGB hue angle and chroma -->
<polyline points="0,0 22.4863,-12.5846"/>
<polyline points="0,0 -23.3888,-17.9498"/>
<polyline points="0,0 -3.2457,31.1528"/>
<polyline points="0,0 -14.9444,3.9398"/>
<polyline points="0,0 27.4566,16.9156"/>
<polyline points="0,0 -7.1369,-19.8570"/>
</g>
<!-- radial lines for display-p3 hue angle and chroma -->
<polyline points="0,0 26.2042,-14.5002"/>
<polyline points="0,0 -30.4241,-20.7967"/>
<polyline points="0,0 -3.3487,32.1416"/>
<polyline points="0,0 -20.0284,4.6747"/>
<polyline points="0,0 31.6423,17.2058"/>
<polyline points="0,0 -8.4729,-22.9916"/>
</g>

<!-- sRGB primaries and secondaries -->
<g stroke-dasharray="0.6 1.2" stroke="#bbb" stroke-width="0.3" fill="white">
  <circle r="1.3" cx="22.4863" cy="-12.5846" fill="#FF000040"/>
  <circle r="1.3" cx="-23.3888" cy="-17.9498" fill="#00FF0040"/>
  <circle r="1.3" cx="-3.2457" cy="31.1528" fill="#0000FF40"/>
  <circle r="1.3" cx="-14.9444" cy="3.9398" fill="#00FFFF40"/>
  <circle r="1.3" cx="27.4566" cy="16.9156" fill="#FF00FF40"/>
  <circle r="1.3" cx="-7.1369" cy="-19.8570" fill="#FFFF0040"/>
</g>

<!-- display-p3 primaries and secondaries -->
<!-- the fill colors are sRGB, *not the display-p3 colors* -->
<g stroke="none">
  <circle r="1.3" cx="26.2042" cy="-14.5002" fill="red"/>
  <circle r="1.3" cx="-30.4241" cy="-20.7967" fill="green"/>
  <circle r="1.3" cx="-3.3487" cy="32.1416" fill="blue"/>
  <circle r="1.3" cx="-20.0284" cy="4.6747" fill="cyan"/>
  <circle r="1.3" cx="31.6423" cy="17.2058" fill="magenta"/>
  <circle r="1.3" cx="-8.4729" cy="-22.9916" fill="yellow"/>
</g>

<circle r="1.8" fill="black"/>
<circle r="1.3" fill="#777"/>
<circle r="0.8" fill="#fff"/>
<g font-family="sans-serif" font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
  <text x="39.64" y="1">+a</text>
  <text x="-38.42" y="1" text-anchor="end">-a</text>
  <text x="2" y="43.14">-b</text>
  <text x="2" y="-31.99">+b</text>
</g>

<g font-family="sans-serif" font-size="2.4pt">
  <text x="-39.04" y="48.14" font-weight="bold">L</text>
  <text x="-27.11" y="48.14" font-weight="bold">C</text>
  <text x="-13.69" y="48.14" font-weight="bold">H</text>
  <text x="24.82" y="48.14" font-weight="bold">L</text>
  <text x="36.75" y="48.14" font-weight="bold">C</text>
  <text x="50.17" y="48.14" font-weight="bold">H</text>
  <circle r="1.08" cx="-61" cy="52.1" fill="red"/>
  <text x="-56.92" y="52.94">red</text>
  <text x="-39.04" y="52.94">64.86%</text>
  <text x="-27.11" y="52.94">0.29949</text>
  <text x="-13.69" y="52.94">28.96</text>
  <circle r="1.08" cx="7.32" cy="52.1" fill="cyan"/>
  <text x="11.4" y="52.94">cyan</text>
  <text x="24.82" y="52.94">89.29%</text>
  <text x="36.75" y="52.94">0.20567</text>
  <text x="50.17" y="52.94">193.14</text>
  <circle r="1.08" cx="-61" cy="56.9" fill="green"/>
  <text x="-56.92" y="57.74">green</text>
  <text x="-39.04" y="57.74">84.88%</text>
  <text x="-27.11" y="57.74">0.36853</text>
  <text x="-13.69" y="57.74">145.64</text>
  <circle r="1.08" cx="7.32" cy="56.9" fill="magenta"/>
  <text x="11.4" y="57.74">magenta</text>
  <text x="24.82" y="57.74">72.50%</text>
  <text x="36.75" y="57.74">0.36018</text>
  <text x="50.17" y="57.74">331.46</text>
  <circle r="1.08" cx="-61" cy="61.7" fill="blue"/>
  <text x="-56.92" y="62.54">blue</text>
  <text x="-39.04" y="62.54">46.64%</text>
  <text x="-27.11" y="62.54">0.32316</text>
  <text x="-13.69" y="62.54">264.05</text>
  <circle r="1.08" cx="7.32" cy="61.7" fill="yellow"/>
  <text x="11.4" y="62.54">yellow</text>
  <text x="24.82" y="62.54">96.48%</text>
  <text x="36.75" y="62.54">0.24503</text>
  <text x="50.17" y="62.54">110.23</text>
</g>
</svg>

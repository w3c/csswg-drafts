<svg xmlns="http://www.w3.org/2000/svg" viewBox="-227.52 -189 417 458" overflow="visible" width="700" height="769">
<desc>Show a top-down view of the Jzazbz color space.
      The rec2020 primaries and secondaries are shown,
      with a legend giving the Jz, Cz and hz values.
      For comparison, the sRGB primaries and secondaries are also shown (dashed lines).
</desc>
<!-- az,bz values multiplied by 1000 for convenient plotting,
     and bz negated for a y-down coordinate system -->
<rect x="-227.52" y="-189" width="100%" height="100%" fill="white" />
<g fill="none" stroke="black" stroke-width="0.7">

<!-- axes -->
<polyline points="0 -169 0 202.64"/>
<polyline points="-204.87 0 166.85 0"/>

<!-- tic marks -->
<g stroke="#888">
<path d="M-3,-160 h6 M-3,-140 h6 M-3,-120 h6 M-3,-100 h6 M-3,-80 h6 M-3,-60 h6 M-3,-40 h6 M-3,-20 h6 M-3,20 h6 M-3,40 h6 M-3,60 h6 M-3,80 h6 M-3,100 h6 M-3,120 h6 M-3,140 h6 M-3,160 h6 M-3,180 h6 M-3,200 h6"/>
<path d="M-200,-3 v6 M-180,-3 v6 M-160,-3 v6 M-140,-3 v6 M-120,-3 v6 M-100,-3 v6 M-80,-3 v6 M-60,-3 v6 M-40,-3 v6 M-20,-3 v6 M20,-3 v6 M40,-3 v6 M60,-3 v6 M80,-3 v6 M100,-3 v6 M120,-3 v6 M140,-3 v6 M160,-3 v6"/>
</g>

<g stroke-dasharray="1 2" stroke="#bbb">
<!-- radial lines for sRGB hue angle and chroma -->
<polyline points="0,0 108.286,-100.872"/>
<polyline points="0,0 -100.540,-109.282"/>
<polyline points="0,0 -35.468,170.257"/>
<polyline points="0,0 -65.203,28.685"/>
<polyline points="0,0 101.807,82.845"/>
<polyline points="0,0 -26.227,-124.525"/>
</g>
<!-- radial lines for rec2020 hue angle and chroma -->
<polyline points="0,0 151.845,-122.326"/>
<polyline points="0,0 -189.870,-133.545"/>
<polyline points="0,0 -67.992,187.641"/>
<polyline points="0,0 -139.162,44.498"/>
<polyline points="0,0 146.719,75.255"/>
<polyline points="0,0 -31.377,-154.000"/>
</g>

<!-- sRGB primaries and secondaries -->
<g stroke-dasharray="1 2" stroke="#bbb" stroke-width="0.7" fill="white">
  <circle r="3.9" cx="108.286" cy="-100.872" fill="#FF000040"/>
  <circle r="3.9" cx="-100.540" cy="-109.282" fill="#00FF0040"/>
  <circle r="3.9" cx="-35.468" cy="170.257" fill="#0000FF40"/>
  <circle r="3.9" cx="-65.203" cy="28.685" fill="#00FFFF40"/>
  <circle r="3.9" cx="101.807" cy="82.845" fill="#FF00FF40"/>
  <circle r="3.9" cx="-26.227" cy="-124.525" fill="#FFFF0040"/>
</g>

<!-- rec2020 primaries and secondaries -->
<!-- the fill colors are sRGB, *not the rec2020 colors* -->
<g stroke="none">
  <circle r="3.9" cx="151.845" cy="-122.326" fill="red"/>
  <circle r="3.9" cx="-189.870" cy="-133.545" fill="green"/>
  <circle r="3.9" cx="-67.992" cy="187.641" fill="blue"/>
  <circle r="3.9" cx="-139.162" cy="44.498" fill="cyan"/>
  <circle r="3.9" cx="146.719" cy="75.255" fill="magenta"/>
  <circle r="3.9" cx="-31.377" cy="-154.000" fill="yellow"/>
</g>

<circle r="5.4"/>
<circle r="3.9" fill="#777"/>
<circle r="2.4" fill="#fff"/>
<g font-family="sans-serif" font-size="6.8pt">
<!-- haha not really 6.8pt but a unit is required per CSS -->
  <text x="170.85" y="2">+az</text>
  <text x="-208.87" y="2" text-anchor="end">-az</text>
  <text x="4" y="212.64">-bz</text>
  <text x="4" y="-175">+bz</text>
</g>

<g font-family="sans-serif" font-size="4.8pt">
  <text x="-97.43" y="222.64" font-weight="bold">Jz</text>
  <text x="-67.62" y="222.64" font-weight="bold">Cz</text>
  <text x="-37.81" y="222.64" font-weight="bold">hz</text>
  <text x="47.31" y="222.64" font-weight="bold">Jz</text>
  <text x="77.12" y="222.64" font-weight="bold">Cz</text>
  <text x="106.93" y="222.64" font-weight="bold">hz</text>
  <circle r="3.24" cx="-133.5" cy="230.56" fill="red"/>
  <text x="-124.26" y="232.24">red</text>
  <text x="-97.43" y="232.24">0.135595</text>
  <text x="-67.62" y="232.24">0.197156</text>
  <text x="-37.81" y="232.24">39.0981</text>
  <circle r="3.24" cx="11.24" cy="230.56" fill="cyan"/>
  <text x="20.48" y="232.24">cyan</text>
  <text x="47.31" y="232.24">0.149670</text>
  <text x="77.12" y="232.24">0.137087</text>
  <text x="106.93" y="232.24">188.0807</text>
  <circle r="3.24" cx="-133.5" cy="240.16" fill="green"/>
  <text x="-124.26" y="241.84">green</text>
  <text x="-97.43" y="241.84">0.138687</text>
  <text x="-67.62" y="241.84">0.222759</text>
  <text x="-37.81" y="241.84">143.3325</text>
  <circle r="3.24" cx="11.24" cy="240.16" fill="magenta"/>
  <text x="20.48" y="241.84">magenta</text>
  <text x="47.31" y="241.84">0.148128</text>
  <text x="77.12" y="241.84">0.163382</text>
  <text x="106.93" y="241.84">343.4944</text>
  <circle r="3.24" cx="-133.5" cy="249.76" fill="blue"/>
  <text x="-124.26" y="251.44">blue</text>
  <text x="-97.43" y="251.44">0.067736</text>
  <text x="-67.62" y="251.44">0.186105</text>
  <text x="-37.81" y="251.44">249.6552</text>
  <circle r="3.24" cx="11.24" cy="249.76" fill="yellow"/>
  <text x="20.48" y="251.44">yellow</text>
  <text x="47.31" y="251.44">0.184104</text>
  <text x="77.12" y="251.44">0.156390</text>
  <text x="106.93" y="251.44">97.8016</text>
</g>
</svg>

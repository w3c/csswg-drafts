<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 579 410" width="579" height="410">
<title>VATVAW set in Lato, without and with kerning</title>
<style>
@font-face {
	font-family: "Lato";
	src: url("fonts/Lato.woff2") format("woff2");
}
.label { font-family: sans-serif; font-size: 18px; fill: #555; }
.demo { font-family: "Lato"; font-size: 120px; fill: black; }
</style>
<rect width="100%" height="100%" fill="white"/>
<text class="label" x="30" y="56">font-kerning: none</text>
<text class="demo" x="30" y="160" style="font-kerning: none">VATVAW</text>
<text class="label" x="30" y="246">font-kerning: normal</text>
<text class="demo" x="30" y="350" style="font-kerning: normal">VATVAW</text>
</svg>
